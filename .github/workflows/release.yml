# Push a tag to publish:
#   v0.1.0         -> release
#   v0.1.0-beta1   -> beta
#   v0.1.0-alpha1  -> alpha
# The tag replaces @project-version@ in the TOC. Interface 16001 is detected
# as WoW Forever (CurseForge game version 1.60.1) by packager v2.6+.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CF_API_KEY     CurseForge API token
#   CF_PROJECT_ID  CurseForge project ID (kept out of the TOC)
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the changelog is built from commits since the last tag

      - uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ secrets.CF_PROJECT_ID }}
