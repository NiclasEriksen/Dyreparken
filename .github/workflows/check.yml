# Static checks + test suite with coverage floors (tools/check.sh). Runs on every push
# and pull request, and before every release.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit lua-check
      - name: Install the Lua language server
        run: |
          v=3.19.2
          mkdir -p "$HOME/luals" && cd "$HOME/luals"
          curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/$v/lua-language-server-$v-linux-x64.tar.gz" | tar xz
          echo "$HOME/luals/bin" >> "$GITHUB_PATH"
      - name: Run checks
        run: tools/check.sh
