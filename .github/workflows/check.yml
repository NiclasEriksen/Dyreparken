# Static checks + headless smoke test (tools/check.sh). Runs on every push
# and pull request, and before every release.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Run checks
        run: tools/check.sh
